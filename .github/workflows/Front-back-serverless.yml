name: Front & Backend Serverless Build & Deploy

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ap-northeast-2

jobs:
  # Frontend Build & Deploy
  Build-Frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install React dependencies
        working-directory: ./Frontend
        run: npm install --legacy-peer-deps

      - name: Build React
        working-directory: ./Frontend
        run: CI=false npm run build

      - name: Deploy React to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          echo "Uploading React build to S3..."
          aws s3 cp --recursive ./Frontend/build s3://netflix1-react/frontend --region $AWS_REGION
          echo "React deployment completed."

  # Backend Build & Deploy (Lambda)
  Build-Backend:
    runs-on: ubuntu-latest
    needs: Build-Frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 22
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 22

      - name: Fix gradlew for Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y dos2unix unzip
          dos2unix ./backend/netflix2/gradlew
          chmod +x ./backend/netflix2/gradlew

      - name: Build Spring Boot JAR
        working-directory: ./backend/netflix2
        run: ./gradlew clean build -x test

      - name: Upload JAR to S3 for Lambda
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          JAR_FILE=$(ls ./backend/netflix2/build/libs/*.jar | head -n 1)
          echo "Uploading $JAR_FILE to S3..."
          aws s3 cp $JAR_FILE s3://netflix1-react/backend/app.jar --region $AWS_REGION
          echo "Backend JAR uploaded."

      - name: Update Lambda Function
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          aws lambda update-function-code \
            --function-name NetflixBackend \
            --s3-bucket netflix1-react \
            --s3-key backend/app.jar \
            --region $AWS_REGION
          echo "Lambda function updated."
