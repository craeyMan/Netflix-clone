name: FrontBack Serverless Build & Deploy

on:
  push:
    branches:
      - main

jobs:
  Build-Frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: '18'

      - run: npm install --legacy-peer-deps
        working-directory: ./Frontend

      - run: CI=false npm run build
        working-directory: ./Frontend

      - name: Deploy React to S3
        run: |
          aws s3 cp --recursive ./Frontend/build s3://netflix1-react --region ap-northeast-2
          if [ $? -ne 0 ]; then exit 1; fi
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  Build-Backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 22

      - run: |
          sudo apt-get update
          sudo apt-get install -y dos2unix unzip python3-pip
          dos2unix ./backend/netflix2/gradlew
          chmod +x ./backend/netflix2/gradlew

      - run: ./gradlew clean build -x test
        working-directory: ./backend/netflix2

      - name: Upload JAR to S3
        run: |
          JAR_FILE=$(ls ./backend/netflix2/build/libs/*.jar | head -n 1)
          echo "Uploading $JAR_FILE to S3..."
          aws s3 cp $JAR_FILE s3://netflix-backend-lambda/app.jar --region $AWS_REGION
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ap-northeast-2

      - name: Update Lambda from S3
        run: |
          aws lambda update-function-code \
            --function-name NetflixBackend \
            --s3-bucket netflix-backend-lambda \
            --s3-key app.jar \
            --region $AWS_REGION
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ap-northeast-2
