name: Front-Back Build & Deploy

on:
  push:
    branches:
      - main

jobs:
  Build-Frontend:
    runs-on: ubuntu-latest
    steps:
      - name: 레포지토리 체크아웃
        uses: actions/checkout@v3

      - name: Node.js 설치
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: React 의존성 설치
        working-directory: ./Frontend
        run: npm install --legacy-peer-deps

      - name: React 빌드
        working-directory: ./Frontend
        run: CI=false npm run build

      - name: S3로 React 배포
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ap-northeast-2
        run: |
          aws s3 cp --recursive ./Frontend/build s3://netflix1-react/frontend --region $AWS_REGION

  Build-Backend:
    runs-on: ubuntu-latest
    needs: Build-Frontend
    env:
      AWS_REGION: ap-northeast-2
      EC2_INSTANCE_ID: i-004e4b21c1c1ba292
      JAR_PATH: /home/ubuntu/app/app.jar
      SERVICE_NAME: netflix-backend

    steps:
      - name: 레포지토리 체크아웃
        uses: actions/checkout@v3

      - name: JDK 22 설치
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 22

      - name: Spring Boot JAR 빌드
        working-directory: ./backend/netflix2
        run: |
          chmod +x ./gradlew
          ./gradlew clean build -x test

      - name: 빌드 결과 확인
        run: ls -lh ./backend/netflix2/build/libs/ || true

      - name: AWS 자격증명 설정
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: S3에 JAR 업로드 (자동 선택)
        run: |
          JAR_FILE=$(ls ./backend/netflix2/build/libs/*-SNAPSHOT*.jar 2>/dev/null | grep -v 'plain.jar' | head -n 1 || true)
          if [ -z "$JAR_FILE" ]; then
            JAR_FILE=$(ls ./backend/netflix2/build/libs/*.jar 2>/dev/null | head -n 1 || true)
          fi
          if [ -z "$JAR_FILE" ]; then
            echo "ERROR: No JAR file found in ./backend/netflix2/build/libs/"
            exit 1
          fi
          echo "Found JAR: $JAR_FILE"
          aws s3 cp "$JAR_FILE" "s3://netflix1-react/backend/netflix2.jar" --region "$AWS_REGION"

      - name: EC2로 JAR 배포 & 서비스 재시작 (SSM)
        run: |
          aws ssm send-command \
            --targets "Key=instanceIds,Values=$i-004e4b21c1c1ba292" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Spring Boot JAR" \
            --parameters file://commands.json \
            --region "${AWS_REGION}"
