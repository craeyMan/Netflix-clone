name: Front-Back Build & Deploy

on:
  push:
    branches:
      - main

jobs:
  Build-Frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install React dependencies
        working-directory: ./Frontend
        run: npm install --legacy-peer-deps

      - name: Build React
        working-directory: ./Frontend
        run: CI=false npm run build

      - name: Deploy React to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ap-northeast-2
        run: |
          aws s3 cp --recursive ./Frontend/build s3://netflix1-react/frontend --region $AWS_REGION

  Build-Backend:
    runs-on: ubuntu-latest
    needs: Build-Frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 22
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 22

      - name: Build Spring Boot JAR
        working-directory: ./backend/netflix2
        run: ./gradlew clean build -x test

      - name: Upload JAR to EC2
        uses: appleboy/scp-action@v0.1.6
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          source: ./backend/netflix2/build/libs/app-0.0.1-SNAPSHOT.jar
          target: /home/ubuntu/app.jar

      - name: Restart Spring Boot service
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            sudo systemctl daemon-reload
            sudo systemctl stop myapp || true
            sudo systemctl start myapp
            sudo systemctl status myapp
