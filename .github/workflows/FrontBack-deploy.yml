name: FrontBack Build & Deploy to Lambda

on:
  push:
    branches:
      - main

jobs:
  build-Frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install React dependencies
        working-directory: ./Frontend
        run: npm install --legacy-peer-deps

      - name: Build React
        working-directory: ./Frontend
        run: CI=false npm run build

      - name: Deploy React to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          aws s3 cp --recursive ./Frontend/build s3://netflix1-react --region ap-northeast-2
          if [ $? -eq 0 ]; then
            echo "React deployment successful."
          else
            echo "React deployment failed."
            exit 1
          fi

  build-Backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 22
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 22

      - name: Fix gradlew for Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y dos2unix
          dos2unix ./backend/netflix2/gradlew
          chmod +x ./backend/netflix2/gradlew

      - name: Build Spring Boot with Gradle
        working-directory: ./backend/netflix2
        run: ./gradlew build -x test

      - name: Login to AWS ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image for Lambda
        working-directory: ./backend/netflix2
        run: |
          docker build -t ${{ secrets.ECR_REPO }}:latest .

      - name: Push Docker image to ECR
        run: |
          docker tag ${{ secrets.ECR_REPO }}:latest ${{ secrets.ECR_REPO_URI }}:latest
          docker push ${{ secrets.ECR_REPO_URI }}:latest

      - name: Update Lambda function to use new image
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ap-northeast-2
        run: |
          aws lambda update-function-code \
            --function-name my-lambda-function \
            --image-uri ${{ secrets.ECR_REPO_URI }}:latest
