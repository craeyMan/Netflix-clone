name: FrontBack Build & Deploy

on:
  push:
    branches:
      - main

jobs:
  build-Frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install React dependencies
        working-directory: ./Frontend
        run: npm install --legacy-peer-deps

      - name: Build React
        working-directory: ./Frontend
        run: CI=false npm run build

      - name: Deploy React to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          aws s3 cp --recursive ./Frontend/build s3://netflix1-react --region ap-northeast-2
          if [ $? -eq 0 ]; then
            echo "React deployment successful."
          else
            echo "React deployment failed."
            exit 1
          fi

  build-Backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 22
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 22

      - name: Fix gradlew for Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y dos2unix
          dos2unix ./backend/netflix2/gradlew
          chmod +x ./backend/netflix2/gradlew

      - name: Build Spring Boot with Gradle
        working-directory: ./backend/netflix2
        run: ./gradlew build -x test

      - name: Upload JAR to SSM Temp
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Copy JAR to EC2 via SSM
        run: |
          aws ssm send-command \
            --targets "Key=instanceIds,Values=i-01407f869499ddfe1" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Spring Boot JAR" \
            --parameters 'commands=[
              "sudo cp /tmp/netflix2-0.0.1-SNAPSHOT.jar /home/ubuntu/app.jar",
              "sudo chown ubuntu:ubuntu /home/ubuntu/app.jar",
              "sudo systemctl daemon-reload",
              "sudo systemctl stop myapp || true",
              "sudo systemctl start myapp"
            ]' \
            --region ap-northeast-2
