name: FrontBack Build & Deploy

on:
  push:
    branches:
      - main

jobs:
  build-Frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install React dependencies
        working-directory: ./Frontend
        run: npm install --legacy-peer-deps

      - name: Build React
        working-directory: ./Frontend
        run: CI=false npm run build

      - name: Deploy React to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          aws s3 cp --recursive ./Frontend/build s3://netflix1-react --region ap-northeast-2
          if [ $? -eq 0 ]; then
            echo "React deployment successful."
          else
            echo "React deployment failed."
            exit 1
          fi

 build-Backend:
  name: Build & Deploy Spring Boot Lambda
  runs-on: ubuntu-latest
  steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up JDK 22
      uses: actions/setup-java@v3
      with:
        distribution: temurin
        java-version: 22

    - name: Fix gradlew for Linux
      run: |
        sudo apt-get update
        sudo apt-get install -y dos2unix unzip python3-pip
        dos2unix ./backend/netflix2/gradlew
        chmod +x ./backend/netflix2/gradlew

    - name: Build Spring Boot JAR
      working-directory: ./backend/netflix2
      run: ./gradlew clean build -x test

    - name: Install AWS SAM CLI
      run: |
        pip3 install --upgrade pip
        pip3 install aws-sam-cli

    - name: Deploy Lambda via SAM
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_REGION: ap-northeast-2
      run: |
        cd ./backend/netflix2
        sam build
        sam deploy --stack-name netflix-backend \
                   --capabilities CAPABILITY_IAM \
                   --region $AWS_REGION \
                   --no-confirm-changeset \
                   --resolve-s3
