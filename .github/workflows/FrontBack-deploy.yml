name: FrontBack Build & Deploy

on:
  push:
    branches:
      - main

jobs:
  build-Frontend:
    name: Build & Deploy React Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install React dependencies
        working-directory: ./Frontend
        run: npm install --legacy-peer-deps

      - name: Build React
        working-directory: ./Frontend
        run: CI=false npm run build

      - name: Deploy React to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          aws s3 sync ./Frontend/build s3://$S3_BUCKET_NAME --delete --region $AWS_REGION
          aws cloudfront create-invalidation --distribution-id $CLOUDFRONT_DISTRIBUTION_ID --paths "/*"

  build-Backend:
    name: Build & Deploy Spring Boot Lambda
    runs-on: ubuntu-latest
    needs: build-Frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 22
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 22

      - name: Fix gradlew for Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y dos2unix unzip python3-pip
          dos2unix ./backend/netflix2/gradlew
          chmod +x ./backend/netflix2/gradlew

      - name: Build Spring Boot JAR
        working-directory: ./backend/netflix2
        run: ./gradlew clean build -x test

      - name: Install AWS SAM CLI
        run: |
          pip3 install --upgrade pip
          pip3 install aws-sam-cli

      - name: Deploy Lambda via SAM
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          cd ./backend/netflix2
          sam build
          sam deploy --stack-name netflix-backend \
                     --capabilities CAPABILITY_IAM \
                     --region $AWS_REGION \
                     --no-confirm-changeset \
                     --resolve-s3
