name: FrontBack Build & Deploy

on:
  push:
    branches:
      - main

jobs:
  build-react:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install React dependencies
        working-directory: ./Frontend
        run: npm install --legacy-peer-deps

      - name: Build React
        working-directory: ./Frontend
        run: CI=false npm run build

      - name: Deploy React to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          aws s3 cp --recursive ./Frontend/build s3://netflix1-react --region ap-northeast-2
          if [ $? -eq 0 ]; then
            echo "React deployment successful."
          else
            echo "React deployment failed."
            exit 1
          fi

  build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 22
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 22

      - name: Verify Java version
        run: java -version

      - name: Fix gradlew for Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y dos2unix
          dos2unix ./backend/gradlew
          chmod +x ./backend/gradlew

      - name: Build Spring Boot with Gradle
        working-directory: ./backend
        run: ./gradlew build -x test

      - name: List built JARs
        run: ls -la ./backend/build/libs

      - name: Copy JAR to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: ./backend/build/libs/netflix2-0.0.1-SNAPSHOT.jar
          target: /home/ubuntu/

      - name: Deploy Backend on EC2
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -e
            NEW_JAR="/home/ubuntu/netflix2-0.0.1-SNAPSHOT.jar"
            APP_JAR="/home/ubuntu/app.jar"

            if [ -f "$NEW_JAR" ]; then
              sudo systemctl stop myapp || true
              sudo mv "$NEW_JAR" "$APP_JAR"
              sudo chown ubuntu:ubuntu "$APP_JAR"
              sudo systemctl daemon-reload
              sudo systemctl start myapp
              sudo systemctl status myapp --no-pager
            else
              echo "ERROR: $NEW_JAR not found on EC2."
              exit 1
            fi
